name: Deploy su hosting

on:
  push:
    branches:
      - master
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Un'unica secret FTP_CONFIG, 4 righe: host, utente, password, path
      # remoto. Cosi' impostare un nuovo repo richiede un solo campo da
      # incollare invece di quattro.
      - name: Estrai credenziali FTP
        id: ftp
        env:
          FTP_CONFIG: ${{ secrets.FTP_CONFIG }}
        run: |
          HOST=$(sed -n '1p' <<< "$FTP_CONFIG")
          USER=$(sed -n '2p' <<< "$FTP_CONFIG")
          PASS=$(sed -n '3p' <<< "$FTP_CONFIG")
          DIR=$(sed -n '4p' <<< "$FTP_CONFIG")
          echo "::add-mask::$USER"
          echo "::add-mask::$PASS"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ steps.ftp.outputs.pass }}
          server-dir: ${{ steps.ftp.outputs.dir || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            api/data/**
            cypress/**
            README.md
