name: Deploy su hosting

on:
  push:
    branches:
      - master
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /shoppingkart.mrcariol.it/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            api/data/**
            cypress/**
            README.md
