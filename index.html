<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shopping Kart</title>

<meta name="description" content="Lista della spesa e piano alimentare settimanale, offline, con ricette e categorie personalizzabili.">

<!--
  CACHE BUSTING: la cache dei browser mobile (in particolare su Edge/Lumia)
  e' molto aggressiva. Il metodo usato qui, senza build step e senza
  Service Worker, e' una versione manuale in query string su ogni file
  locale: "?v=20260828b" in fondo a css/js/manifest/icone.

  Prima di ogni pubblicazione: cerca "20260828b" in QUESTO file E in
  manifest.json e browserconfig.xml, sostituiscilo ovunque con un nuovo
  valore (es. la data del giorno + una lettera). Cambiando l'URL del file,
  il telefono e' costretto a scaricarne una copia nuova anche se il nome
  del file resta identico.
-->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="manifest" href="manifest.json?v=20260828b">
<meta name="theme-color" content="#343a40">

<!-- iOS: comportamento "app installata" da schermata Home -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Shopping Kart">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=20260828b">

<!-- Windows 10 Mobile / Edge legacy: aspetto del tile se "aggiunto a Start" -->
<meta name="msapplication-config" content="browserconfig.xml?v=20260828b">
<meta name="msapplication-TileColor" content="#343a40">

<link rel="icon" href="icons/icon-192.png?v=20260828b">

<!-- Bootstrap 4.6 self-hosted: copre praticamente tutto lo stile dell'app -->
<link rel="stylesheet" href="css/bootstrap.min.css?v=20260828b">
<!-- le poche regole che Bootstrap 4 non offre (vedi commenti nel file) -->
<link rel="stylesheet" href="css/custom.css?v=20260828b">
</head>
<body>

<div id="app">

  <!-- ===================== TESTATA ===================== -->
  <nav class="navbar navbar-dark bg-dark py-2">
    <span class="navbar-brand mb-0 h5"><mdi-icon name="cart-outline" :size="22" class="mr-1"></mdi-icon>Shopping Kart</span>
    <button type="button" class="btn btn-outline-light btn-sm" v-if="loggedIn" @click="syncNow" :disabled="syncing" aria-label="Sincronizza ora">
      <mdi-icon name="sync" :size="18" :class="{ 'icon-spin': syncing }"></mdi-icon>
    </button>
  </nav>

  <main class="container pt-3" :class="view === 'lista' ? 'content-spacer-lista' : 'content-spacer'">

    <!-- ===================== VISTA: LISTA DELLA SPESA ===================== -->
    <template v-if="view === 'lista'">
      <h1 class="h5 mb-3">Lista della spesa</h1>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <select class="custom-select custom-select-sm" style="max-width: 200px;" v-model="sortMode" aria-label="Ordina lista">
          <option value="categoria">Ordina: per categoria</option>
          <option value="alpha-asc">Ordina: A → Z</option>
          <option value="alpha-desc">Ordina: Z → A</option>
        </select>
        <span>
          <button type="button" class="btn btn-outline-secondary btn-sm mr-2" @click="setView('categorie-lista')" aria-label="Categorie">
            <mdi-icon name="tag-multiple-outline" :size="16"></mdi-icon>
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm mr-2" v-if="doneCount > 0" @click="svuotaAcquistati">Svuota presi</button>
          <span class="badge badge-secondary">{{ doneCount }} / {{ totalCount }} presi</span>
        </span>
      </div>

      <div class="text-center text-muted py-5" v-if="totalCount === 0">
        <mdi-icon name="cart-off" :size="48" class="mb-2 text-muted"></mdi-icon>
        <p class="h5 text-dark mb-1">La lista è vuota</p>
        <p class="mb-0">Aggiungi il primo articolo dalla barra qui sotto.</p>
      </div>

      <!-- vista per categoria -->
      <template v-else-if="sortMode === 'categoria'">
        <div class="mb-4" v-for="group in visibleGroups" :key="group.id || 'senza-categoria'">
          <div class="d-flex justify-content-between align-items-center text-uppercase text-muted small border-bottom pb-1 mb-1">
            <span>{{ group.nome }}</span>
            <span class="badge badge-secondary">{{ group.items.length }}</span>
          </div>
          <ul class="list-group list-group-flush">
            <item-row
              v-for="item in group.items"
              :key="item.id"
              :item="item"
              :units="units"
              :categories="categorie"
              @remove="removeItem">
            </item-row>
          </ul>
        </div>
      </template>

      <!-- vista alfabetica piatta (asc / desc) -->
      <template v-else>
        <ul class="list-group list-group-flush">
          <item-row
            v-for="item in sortedFlatItems"
            :key="item.id"
            :item="item"
            :units="units"
            :categories="categorie"
            @remove="removeItem">
          </item-row>
        </ul>
      </template>

      <!-- prodotti: catalogo non ancora nella lista, per aggiungerli rapidamente -->
      <div class="mt-5 pt-3 border-top">
        <button type="button" class="btn btn-link btn-block d-flex justify-content-between align-items-center text-decoration-none px-0" @click="prodottiAperto = !prodottiAperto">
          <span class="text-dark">Prodotti ({{ prodottiDaAggiungere.length }})</span>
          <mdi-icon :name="prodottiAperto ? 'chevron-up' : 'chevron-down'" :size="18"></mdi-icon>
        </button>
        <div class="mt-2" v-if="prodottiAperto">
          <p class="text-muted small" v-if="prodotti.length === 0">
            Nessun prodotto ancora creato: si creano anche al volo mentre componi una ricetta.
          </p>
          <p class="text-muted small" v-else-if="prodottiDaAggiungere.length === 0">
            Tutti i prodotti sono già nella lista.
          </p>
          <template v-else-if="sortMode === 'categoria'">
            <div class="mb-3" v-for="group in prodottiDaAggiungereRaggruppati" :key="group.id || 'senza-categoria'">
              <div class="d-flex justify-content-between align-items-center text-uppercase text-muted small border-bottom pb-1 mb-1">
                <span>{{ group.nome }}</span>
                <span class="badge badge-secondary">{{ group.items.length }}</span>
              </div>
              <ul class="list-group list-group-flush">
                <prodotto-row
                  v-for="p in group.items"
                  :key="p.id"
                  :prodotto="p"
                  :units="units"
                  :categories="categorie"
                  @add="aggiungiProdottoALista"
                  @remove="deleteProdotto">
                </prodotto-row>
              </ul>
            </div>
          </template>
          <ul class="list-group list-group-flush" v-else>
            <prodotto-row
              v-for="p in prodottiDaAggiungere"
              :key="p.id"
              :prodotto="p"
              :units="units"
              :categories="categorie"
              @add="aggiungiProdottoALista"
              @remove="deleteProdotto">
            </prodotto-row>
          </ul>
        </div>
      </div>
    </template>

    <!-- ===================== VISTA: PIANO ALIMENTARE ===================== -->
    <template v-else-if="view === 'piano'">
      <h1 class="h5 mb-2">Piano alimentare</h1>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" @click="prevWeek" aria-label="Settimana precedente">
          <mdi-icon name="chevron-left"></mdi-icon>
        </button>
        <div class="text-center">
          <div class="font-weight-bold">{{ weekRangeLabel }}</div>
          <button type="button" class="btn btn-link btn-sm p-0" @click="vaiOggi">Oggi</button>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm" @click="nextWeek" aria-label="Settimana successiva">
          <mdi-icon name="chevron-right"></mdi-icon>
        </button>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <span class="mb-1">
          <button type="button" class="btn btn-outline-secondary btn-sm mr-1" @click="copiaSettimana">
            <mdi-icon name="content-copy" :size="14" class="mr-1"></mdi-icon>Copia settimana
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" v-if="clipboard && clipboard.type === 'week'" @click="incollaSettimana">
            <mdi-icon name="content-paste" :size="14" class="mr-1"></mdi-icon>Incolla settimana
          </button>
        </span>
        <button type="button" class="btn btn-primary btn-sm mb-1" @click="apriGeneraLista">
          <mdi-icon name="basket-outline" :size="14" class="mr-1"></mdi-icon>Genera lista
        </button>
      </div>

      <day-row
        v-for="d in weekDates"
        :key="d.getTime()"
        :date="d"
        :meals="mealsForDate(d)"
        :ricette="ricette"
        :is-today="isToday(d)"
        :clipboard="clipboard"
        :drag-drop-supportato="dragDropSupportato"
        @add-recipe="apriAggiungiRicettaCella(d, $event)"
        @remove-voce="rimuoviVoceDaCella(d, $event.mealKey, $event.itemId)"
        @edit-recipe="apriEditorRicettaDaId($event)"
        @duplicate-voce="duplicaVoceInCella(d, $event.mealKey, $event.itemId)"
        @edit-nota="modificaTestoNota(d, $event.mealKey, $event.itemId, $event.testo)"
        @edit-nota-ricetta="modificaNotaRicetta(d, $event.mealKey, $event.itemId, $event.nota)"
        @copy-day="copiaGiorno(d)"
        @paste-day="incollaGiorno(d)"
        @copy-pasto="copiaPasto(d, $event)"
        @paste-pasto="incollaPasto(d, $event)">
      </day-row>
    </template>

    <!-- ===================== VISTA: OGGI ===================== -->
    <!--
      Due colonne (Oggi/Domani) affiancate da "sm" in su (>=576px): sotto
      questa soglia (tutti i telefoni, incluso il Lumia 735 target di
      questa app) tornano impilate a piena larghezza, la stessa larghezza
      "comoda" che questa vista aveva prima di diventare a due colonne -
      niente celle pasto strette come nel Piano settimanale (col-4).
    -->
    <template v-else-if="view === 'oggi'">
      <h1 class="h5 mb-3">Oggi</h1>
      <div class="row">
        <div class="col-12 col-sm-6 mb-3">
          <p class="text-muted mb-2"><strong class="text-dark">Oggi</strong> — {{ giornoLabel(oggiData) }}</p>
          <div class="mb-3" v-for="pasto in pastiConfig" :key="'oggi-' + pasto.key">
            <meal-cell
              :pasto="pasto"
              :voci="mealsForDate(oggiData)[pasto.key]"
              :ricette="ricette"
              :drag-drop-supportato="dragDropSupportato"
              :date-key="todayKey"
              :clipboard="clipboard"
              @add="apriAggiungiRicettaCella(oggiData, pasto.key)"
              @remove="rimuoviVoceDaCella(oggiData, pasto.key, $event)"
              @edit="apriEditorRicettaDaId($event)"
              @duplicate="duplicaVoceInCella(oggiData, pasto.key, $event)"
              @edit-nota="modificaTestoNota(oggiData, pasto.key, $event.itemId, $event.testo)"
              @edit-nota-ricetta="modificaNotaRicetta(oggiData, pasto.key, $event.itemId, $event.nota)"
              @copy-pasto="copiaPasto(oggiData, pasto.key)"
              @paste-pasto="incollaPasto(oggiData, pasto.key)">
            </meal-cell>
          </div>
        </div>
        <div class="col-12 col-sm-6 mb-3">
          <p class="text-muted mb-2"><strong class="text-dark">Domani</strong> — {{ giornoLabel(domaniData) }}</p>
          <div class="mb-3" v-for="pasto in pastiConfig" :key="'domani-' + pasto.key">
            <meal-cell
              :pasto="pasto"
              :voci="mealsForDate(domaniData)[pasto.key]"
              :ricette="ricette"
              :drag-drop-supportato="dragDropSupportato"
              :date-key="domaniKey"
              :clipboard="clipboard"
              @add="apriAggiungiRicettaCella(domaniData, pasto.key)"
              @remove="rimuoviVoceDaCella(domaniData, pasto.key, $event)"
              @edit="apriEditorRicettaDaId($event)"
              @duplicate="duplicaVoceInCella(domaniData, pasto.key, $event)"
              @edit-nota="modificaTestoNota(domaniData, pasto.key, $event.itemId, $event.testo)"
              @edit-nota-ricetta="modificaNotaRicetta(domaniData, pasto.key, $event.itemId, $event.nota)"
              @copy-pasto="copiaPasto(domaniData, pasto.key)"
              @paste-pasto="incollaPasto(domaniData, pasto.key)">
            </meal-cell>
          </div>
        </div>
      </div>
    </template>

    <!-- ===================== VISTA: CATEGORIE LISTA DELLA SPESA / PRODOTTI ===================== -->
    <template v-else-if="view === 'categorie-lista'">
      <h1 class="h5 mb-3">Categorie lista della spesa e prodotti</h1>
      <ul class="list-group mb-2">
        <li class="list-group-item d-flex align-items-center bg-light">
          <input type="text" class="form-control form-control-sm" :value="senzaCategoriaLabel" disabled>
        </li>
        <li class="list-group-item d-flex align-items-center" v-for="(cat, index) in categorie" :key="cat.id">
          <input type="text" class="form-control form-control-sm mr-1" v-model="cat.nome">
          <button type="button" class="btn btn-outline-secondary btn-sm mr-1" :disabled="index === 0" @click="moveCategoryUp(index)" aria-label="Sposta su"><mdi-icon name="chevron-up"></mdi-icon></button>
          <button type="button" class="btn btn-outline-secondary btn-sm mr-1" :disabled="index === categorie.length - 1" @click="moveCategoryDown(index)" aria-label="Sposta giù"><mdi-icon name="chevron-down"></mdi-icon></button>
          <button type="button" class="btn btn-outline-danger btn-sm" @click="deleteCategory(cat)" aria-label="Elimina categoria"><mdi-icon name="trash-can-outline"></mdi-icon></button>
        </li>
      </ul>
      <div class="input-group mb-1">
        <input type="text" class="form-control" v-model="newCategoryNome" placeholder="Nuova categoria…" @keyup.enter="addCategory">
        <div class="input-group-append">
          <button type="button" class="btn btn-outline-primary" @click="addCategory">Aggiungi</button>
        </div>
      </div>
      <p class="small text-muted mb-0">"Senza categoria" è fissa e viene sempre mostrata per prima.</p>
    </template>

    <!-- ===================== VISTA: CATEGORIE RICETTE ===================== -->
    <template v-else-if="view === 'categorie-ricette'">
      <h1 class="h5 mb-3">Categorie ricette</h1>
      <ul class="list-group mb-2">
        <li class="list-group-item" v-for="cat in categorieRicetteOrdinate" :key="cat.id">
          <div class="d-flex align-items-center mb-1">
            <input type="text" class="form-control form-control-sm mr-1" v-model="cat.nome">
            <button type="button" class="btn btn-outline-danger btn-sm" @click="deleteCategoriaRicetta(cat)" aria-label="Elimina categoria ricetta"><mdi-icon name="trash-can-outline"></mdi-icon></button>
          </div>
          <div class="d-flex align-items-center flex-wrap">
            <span class="small text-muted mr-2">Colore:</span>
            <button type="button" class="swatch-btn mr-1" v-for="c in swatchColors" :key="c" :class="{ selected: cat.colore === c }" :style="{ backgroundColor: c }" @click="cat.colore = c" :aria-label="'Colore ' + c"></button>
          </div>
        </li>
      </ul>
      <div class="mb-1">
        <input type="text" class="form-control mb-2" v-model="newCategoriaRicettaNome" placeholder="Nuova categoria ricetta…" @keyup.enter="addCategoriaRicetta">
        <div class="d-flex align-items-center flex-wrap mb-2">
          <span class="small text-muted mr-2">Colore:</span>
          <button type="button" class="swatch-btn mr-1" v-for="c in swatchColors" :key="c" :class="{ selected: newCategoriaRicettaColore === c }" :style="{ backgroundColor: c }" @click="newCategoriaRicettaColore = c" :aria-label="'Colore ' + c"></button>
        </div>
        <button type="button" class="btn btn-outline-primary" @click="addCategoriaRicetta">Aggiungi categoria ricetta</button>
      </div>
    </template>

    <!-- ===================== VISTA: RICETTE ===================== -->
    <template v-else-if="view === 'ricette'">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h5 mb-0">Ricette</h1>
        <button type="button" class="btn btn-outline-secondary btn-sm" @click="setView('categorie-ricette')" aria-label="Categorie ricette">
          <mdi-icon name="palette-outline" :size="16"></mdi-icon>
        </button>
      </div>
      <ul class="list-group mb-2">
        <li class="list-group-item d-flex justify-content-between align-items-center" v-for="r in ricetteOrdinate" :key="r.id">
          <button type="button" class="btn btn-link text-left text-dark p-0 flex-grow-1 text-decoration-none" @click="apriEditorRicettaEsistente(r)">
            <div>{{ r.nome }}</div>
            <div>
              <span
                class="badge mr-1"
                v-for="cid in categorieIdsOrdinati(r.categorieIds)"
                :key="cid"
                :style="{ backgroundColor: (categoriaRicettaById(cid) || {}).colore || '#6c757d', color: '#fff' }">
                {{ (categoriaRicettaById(cid) || {}).nome || '—' }}
              </span>
              <span class="small text-muted">{{ r.ingredienti.length }} ingrediente/i</span>
            </div>
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm ml-2" @click="deleteRicetta(r)" aria-label="Elimina ricetta"><mdi-icon name="trash-can-outline" :size="16"></mdi-icon></button>
        </li>
        <li class="list-group-item text-muted small" v-if="ricette.length === 0">Nessuna ricetta ancora creata.</li>
      </ul>
      <button type="button" class="btn btn-outline-primary" @click="apriEditorRicettaNuova('')">
        <mdi-icon name="plus" class="mr-1"></mdi-icon>Nuova ricetta
      </button>
    </template>

    <!-- ===================== VISTA: IMPOSTAZIONI ===================== -->
    <template v-else>
      <h1 class="h5 mb-3">Impostazioni</h1>

      <!-- aspetto -->
      <section class="mb-4">
        <h6 class="text-uppercase text-muted small">Aspetto</h6>
        <div class="custom-control custom-switch">
          <input type="checkbox" class="custom-control-input" id="tema-scuro-switch" v-model="temaScuro">
          <label class="custom-control-label" for="tema-scuro-switch">Tema scuro</label>
        </div>
      </section>

      <!-- account e sincronizzazione cloud -->
      <section class="mb-4">
        <h6 class="text-uppercase text-muted small">Account</h6>

        <template v-if="!loggedIn">
          <p class="small text-muted">Accedi con il tuo account example.invalid per usare Shopping Kart su più dispositivi con gli stessi dati.</p>
          <button type="button" class="btn btn-primary" @click="login">Accedi con account example.invalid</button>
        </template>

        <template v-else>
          <p class="mb-1">
            Connesso come <strong>{{ authUser ? authUser.name : '…' }}</strong>
            <span class="d-block small text-muted" v-if="authUser">{{ authUser.email }}</span>
          </p>
          <p class="small text-muted mb-2">Ultima sincronizzazione: {{ lastSyncLabel }}</p>
          <div class="d-flex flex-column">
            <button type="button" class="btn btn-outline-primary mb-2" @click="syncNow" :disabled="syncing">
              <mdi-icon name="sync" :size="18" class="mr-1" :class="{ 'icon-spin': syncing }"></mdi-icon>Sincronizza ora
            </button>
            <button type="button" class="btn btn-outline-secondary" @click="logout">Esci</button>
          </div>
        </template>
      </section>

      <!-- backup -->
      <section class="mb-4">
        <h6 class="text-uppercase text-muted small">Backup dati</h6>
        <div class="d-flex flex-column">
          <button type="button" class="btn btn-primary mb-2" @click="exportBackup"><mdi-icon name="tray-arrow-down" class="mr-1"></mdi-icon>Esporta backup (JSON)</button>
          <button type="button" class="btn btn-outline-secondary" @click="triggerImport"><mdi-icon name="tray-arrow-up" class="mr-1"></mdi-icon>Importa backup (JSON)</button>
          <input
            type="file"
            accept="application/json,.json"
            class="d-none"
            ref="importFileInput"
            @change="importBackup">
        </div>
        <p class="small text-muted mt-2 mb-0">Il backup include lista della spesa, categorie, prodotti, ricette e piano alimentare.</p>
      </section>

      <p class="text-center text-muted small mb-0">Versione {{ appVersion }}</p>
    </template>

  </main>

  <!-- ===================== FONDO FISSO: barra aggiungi articolo (solo Lista) + menu ===================== -->
  <div class="fixed-bottom">
    <form v-if="view === 'lista'" class="bg-tertiary border-top p-2" @submit.prevent="addItem">
      <div class="form-row no-gutters">
        <div class="col-7 pr-1 position-relative">
          <input
            type="text"
            id="new-item-input"
            class="form-control"
            v-model="newItemNome"
            placeholder="Aggiungi articolo…"
            autocomplete="off"
            @focus="newItemSuggerimentiAperti = true"
            @blur="newItemSuggerimentiAperti = false"
            @keyup.esc="newItemSuggerimentiAperti = false">
          <div class="list-group autocomplete-dropdown autocomplete-dropdown-up shadow-sm" v-if="newItemSuggerimentiAperti && newItemSuggerimenti.length">
            <button
              type="button"
              class="list-group-item list-group-item-action py-1 px-2"
              v-for="p in newItemSuggerimenti"
              :key="p.id"
              @mousedown.prevent="selezionaSuggerimentoNuovoArticolo(p)">
              {{ p.nome }}
            </button>
          </div>
        </div>
        <div class="col-2 pr-1">
          <input
            type="number"
            min="0"
            step="0.1"
            class="form-control"
            v-model.number="newItemQuantita"
            aria-label="Quantità">
        </div>
        <div class="col-2 pr-1">
          <select class="custom-select unit-select" v-model="newItemUnita" aria-label="Unità di misura">
            <option v-for="u in units" :key="u" :value="u">{{ u }}</option>
          </select>
        </div>
        <div class="col-1">
          <button type="submit" class="btn btn-primary btn-block h-100 px-0 d-flex align-items-center justify-content-center" aria-label="Aggiungi">
            <mdi-icon name="plus" :size="22"></mdi-icon>
          </button>
        </div>
      </div>
    </form>

    <ul class="nav nav-pills nav-fill bg-light border-top py-1 px-3">
      <li class="nav-item">
        <a href="#" class="nav-link py-2 px-1" :class="{ active: view === 'lista' }" @click.prevent="setView('lista')" aria-label="Lista della spesa">
          <mdi-icon name="cart-outline" :size="24"></mdi-icon>
        </a>
      </li>
      <li class="nav-item">

  <template v-if="syncConflict">

    <div class="modal d-block" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">

            <h5 class="modal-title">Dati diversi tra dispositivo e server</h5>
          </div>
          <div class="modal-body">
            <p class="small text-muted">Questo dispositivo e il server hanno dati diversi, modificati entrambi dall'ultima sincronizzazione. Scegli quale versione tenere: l'altra verrà sovrascritta.</p>

            <div class="row no-gutters">
              <div class="col-6 pr-1">
                <div class="card card-body p-2">
                  <div class="font-weight-bold small mb-1">Questo dispositivo</div>
                  <div class="small text-muted mb-2">{{ formatSyncTimestamp(syncConflict.local.aggiornatoIl) }}</div>
                  <div class="small">Lista: {{ syncConflict.local.lista }}</div>
                  <div class="small">Ricette: {{ syncConflict.local.ricette }}</div>
                  <div class="small">Prodotti: {{ syncConflict.local.prodotti }}</div>
                  <div class="small">Giorni pianificati: {{ syncConflict.local.pianoGiorni }}</div>
                </div>
              </div>
              <div class="col-6 pl-1">
                <div class="card card-body p-2">
                  <div class="font-weight-bold small mb-1">Server</div>
                  <div class="small text-muted mb-2">{{ formatSyncTimestamp(syncConflict.remote.aggiornatoIl) }}</div>
                  <div class="small">Lista: {{ syncConflict.remote.lista }}</div>
                  <div class="small">Ricette: {{ syncConflict.remote.ricette }}</div>
                  <div class="small">Prodotti: {{ syncConflict.remote.prodotti }}</div>
                  <div class="small">Giorni pianificati: {{ syncConflict.remote.pianoGiorni }}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer flex-column">
            <button type="button" class="btn btn-primary btn-block" @click="resolveSyncConflict('locale')">Mantieni i dati di questo dispositivo</button>
            <button type="button" class="btn btn-outline-primary btn-block ml-0" @click="resolveSyncConflict('server')">Usa i dati dal server</button>
          </div>
        </div>
      </div>
    </div>
  </template>

            ref="ricettaNotaInput"
            placeholder="nota (es. x2)"
            @blur="confermaModificaNotaRicetta(voce)"
            @keyup.enter="confermaModificaNotaRicetta(voce)"
            @keyup.esc="annullaModificaNotaRicetta">

          <button
            v-else-if="voce.nota"
            type="button"
            class="btn btn-link btn-sm p-0 ml-1 text-muted font-italic small"
            @click="iniziaModificaNotaRicetta(voce)"
            aria-label="Modifica nota">{{ voce.nota }}</button>
        </span>

        <input
          v-else-if="editingNoteId === voce.id"
          type="text"
          class="form-control form-control-sm mr-1"
          v-model="editingNoteText"
          ref="notaInput"
          @blur="confermaModificaNota(voce)"
          @keyup.enter="confermaModificaNota(voce)"
          @keyup.esc="annullaModificaNota">

        <button
          v-else
          type="button"
          class="btn btn-link btn-sm p-0 piano-recipe-name text-dark mr-1 font-italic text-truncate"
          @click="iniziaModificaNota(voce)"
          aria-label="Modifica nota">{{ voce.testo }}</button>

        <span class="flex-shrink-0">
          <button v-if="voce.tipo === 'ricetta' && !voce.nota" type="button" class="btn btn-sm btn-link text-secondary p-0 mr-1 piano-badge-action" @click="iniziaModificaNotaRicetta(voce)" aria-label="Aggiungi nota">
            <mdi-icon name="pencil-outline" :size="12"></mdi-icon>
          </button>
          <button type="button" class="btn btn-sm btn-link text-secondary p-0 mr-1 piano-badge-action" @click="$emit('duplicate', voce.id)" aria-label="Duplica">
            <mdi-icon name="content-copy" :size="12"></mdi-icon>
          </button>
          <button type="button" class="btn btn-sm btn-link text-danger p-0 piano-badge-action" @click="$emit('remove', voce.id)" aria-label="Rimuovi">
            <mdi-icon name="close" :size="12"></mdi-icon>
          </button>
        </span>
      </span>
      <button type="button" class="btn btn-sm btn-outline-secondary btn-block py-0" @click="$emit('add')" aria-label="Aggiungi al piano">
        <mdi-icon name="plus" :size="14"></mdi-icon>
      </button>
    </div>
  </div>
</script>

    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // ricontrolla se c'e' una versione nuova quando l'utente torna sull'app
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update();
      });
      window.addEventListener('focus', function () { reg.update(); });
    });
  });

  // Quando il nuovo Service Worker prende il controllo (skipWaiting +
  // clients.claim in sw.js), ricarica la pagina una volta sola: l'utente
  // vede subito la versione aggiornata senza dover fare nulla.
  var swAggiornamentoInCorso = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swAggiornamentoInCorso) return;
    swAggiornamentoInCorso = true;
    window.location.reload();
  });
}
